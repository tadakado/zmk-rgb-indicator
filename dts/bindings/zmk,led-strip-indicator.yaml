description: |
  LED strip proxy that overlays a connection-status indicator on one pixel and
  forwards every pixel to a target LED strip. Point `chosen { zmk,underglow }`
  at this node instead of the real strip.

compatible: "zmk,led-strip-indicator"

properties:
  target:
    type: phandle
    required: true
    description: The real LED strip device to forward to.
  chain-length:
    type: int
    required: true
    description: Number of pixels (must match the target strip).
  index:
    type: int
    default: 0
    description: Which pixel (0-based) shows the indicator.
  usb-color:
    type: int
    default: 0xff0000
    description: Indicator color (0xRRGGBB) when the USB endpoint is active.
  profile-colors:
    type: array
    default: [0x00ff00, 0x0000ff, 0xffff00, 0x00ffff, 0xff00ff]
    description: |
      Indicator colors (0xRRGGBB) per BLE profile, indexed by profile number
      (entry 0 = profile 0, ...). Defaults to green/blue/yellow/cyan/magenta.
      A profile beyond the end of the list shows nothing (off).
